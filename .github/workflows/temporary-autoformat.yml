name: Temporary extraction autoformat

on:
  pull_request:

permissions:
  contents: write

jobs:
  autoformat:
    if: github.head_ref == 'feat/openobsw-opensvf-bootstrap'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: python -m pip install "ruff==0.16.5"

      - name: Apply deterministic formatting and safe fixes
        run: |
          ruff format .
          ruff check --fix . || true
          ruff format .

      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Normalize extracted adapter formatting"
          git push origin HEAD:${{ github.head_ref }}
