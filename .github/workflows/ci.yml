name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  checks:
    strategy:
      matrix:
        python-version:
          - "3.11"
          - "3.12"

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install adapter and tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Install exact OrbitFabric Core conformance baseline
        run: |
          python -m pip install "orbitfabric @ git+https://github.com/FAROTECH/orbitfabric.git@4377d6656c62aa1dc19a7ed81d2de872b6b22ccd"

      - name: Ruff
        run: ruff check .

      - name: Adapter consistency
        run: python tools/check_adapter_consistency.py

      - name: Tests
        run: pytest -q

      - name: Build wheel
        run: python -m build --wheel

      - name: Verify wheel owns required packaged assets
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile

          wheel = next(Path("dist").glob("*.whl"))
          with zipfile.ZipFile(wheel) as archive:
              names = set(archive.namelist())
          required = {
              "orbitfabric_openobsw_opensvf_adapter/integration_package.json",
              "orbitfabric_openobsw_opensvf_adapter/schemas/profile-0.1.schema.json",
          }
          missing = sorted(required - names)
          if missing:
              raise SystemExit("Missing wheel assets: " + ", ".join(missing))
          PY

      - name: Build documentation
        run: mkdocs build --strict

  target-compatibility-openobsw:
    needs: checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout adapter
        uses: actions/checkout@v4

      - name: Checkout validated OpenOBSW target baseline
        uses: actions/checkout@v4
        with:
          repository: lipofefeyt/openobsw
          ref: 44ceb71a016f0541ff7a0aa74191e13bafdb59c1
          path: _openobsw

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install adapter and target SRDB tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install -e ./_openobsw/srdb

      - name: Run OpenOBSW target-native compatibility control
        run: bash .github/scripts/openobsw-target-compatibility.sh

      - name: Upload OpenOBSW compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openobsw-target-compatibility
          path: /tmp/orbitfabric-openobsw-target-compatibility/evidence
          if-no-files-found: warn

  target-compatibility-opensvf:
    needs: checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout adapter
        uses: actions/checkout@v4

      - name: Checkout validated OpenSVF target baseline
        uses: actions/checkout@v4
        with:
          repository: lipofefeyt/opensvf
          ref: 667d3eadcb0bbd7814ac324b99946c4ed2f11f23
          path: _opensvf

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install adapter and OpenSVF
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install -e ./_opensvf

      - name: Run OpenSVF target-native compatibility control
        run: bash .github/scripts/opensvf-target-compatibility.sh

      - name: Upload OpenSVF compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opensvf-target-compatibility
          path: /tmp/orbitfabric-opensvf-target-compatibility/evidence
          if-no-files-found: warn

  installed-lifecycle:
    needs: checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout adapter
        uses: actions/checkout@v4

      - name: Checkout exact OrbitFabric Core baseline
        uses: actions/checkout@v4
        with:
          repository: FAROTECH/orbitfabric
          ref: 4377d6656c62aa1dc19a7ed81d2de872b6b22ccd
          path: _orbitfabric_core

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install host tooling and exact Core baseline
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m pip install ./_orbitfabric_core

      - name: Run installed lifecycle control
        run: bash .github/scripts/installed-lifecycle.sh

      - name: Upload installed lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openobsw-opensvf-adapter-installed-lifecycle
          path: /tmp/orbitfabric-openobsw-opensvf-installed-lifecycle/evidence
          if-no-files-found: warn

  release-proof:
    needs: installed-lifecycle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout adapter
        uses: actions/checkout@v4

      - name: Checkout exact OrbitFabric Core baseline
        uses: actions/checkout@v4
        with:
          repository: FAROTECH/orbitfabric
          ref: 4377d6656c62aa1dc19a7ed81d2de872b6b22ccd
          path: _orbitfabric_core

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install host tooling and exact Core baseline
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m pip install ./_orbitfabric_core

      - name: Run provider-neutral release proof
        run: bash .github/scripts/release-proof.sh

      - name: Upload release proof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openobsw-opensvf-adapter-release-proof
          path: /tmp/orbitfabric-openobsw-opensvf-release-proof/evidence
          if-no-files-found: warn
