name: Temporary productization fixups

on:
  pull_request:

permissions:
  contents: write

jobs:
  fixups:
    if: github.head_ref == 'feat/openobsw-opensvf-bootstrap'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply explicit productization fixups
        run: |
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          from pathlib import Path

          def replace_exact(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match in {path} for {old!r}, found {count}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          root = Path("src/orbitfabric_openobsw_opensvf_adapter/adapter")
          core_input = root / "core_input.py"
          projection = root / "projection.py"
          target = root / "target.py"
          verification = root / "verification_projector.py"

          replace_exact(
              core_input,
              '                f"Expected exactly one Mission Snapshot object for {domain}/{identifier}, found {len(matches)}",\n',
              '                (\n'
              '                    f"Expected exactly one Mission Snapshot object for "\n'
              '                    f"{domain}/{identifier}, found {len(matches)}"\n'
              '                ),\n',
          )
          replace_exact(
              core_input,
              '            f"Unsupported Core Integration Input Set version: {manifest.get(\'input_set_version\')!r}",\n',
              '            (\n'
              '                "Unsupported Core Integration Input Set version: "\n'
              '                f"{manifest.get(\'input_set_version\')!r}"\n'
              '            ),\n',
          )
          replace_exact(
              core_input,
              '            f"Core input_set_sha256 mismatch: declared {expected_digest!r}, computed {actual_digest}",\n',
              '            (\n'
              '                f"Core input_set_sha256 mismatch: declared {expected_digest!r}, "\n'
              '                f"computed {actual_digest}"\n'
              '            ),\n',
          )
          replace_exact(
              core_input,
              '                f"Expected exactly one Core surface record for role {role}, found {len(role_records)}",\n',
              '                (\n'
              '                    f"Expected exactly one Core surface record for role {role}, "\n'
              '                    f"found {len(role_records)}"\n'
              '                ),\n',
          )
          replace_exact(
              core_input,
              '                f"Core surface digest mismatch for {role}: declared {declared_sha}, computed {actual_sha}",\n',
              '                (\n'
              '                    f"Core surface digest mismatch for {role}: declared {declared_sha}, "\n'
              '                    f"computed {actual_sha}"\n'
              '                ),\n',
          )

          replace_exact(
              projection,
              '            f"Profile TM APID {settings_pus[\'tm_apid\']} is incompatible with selected baseline TM APID {pus_baseline[\'tm_apid\']}",\n',
              '            (\n'
              '                f"Profile TM APID {settings_pus[\'tm_apid\']} is incompatible with "\n'
              '                f"selected baseline TM APID {pus_baseline[\'tm_apid\']}"\n'
              '            ),\n',
          )
          replace_exact(
              projection,
              '                f"Core telemetry type {semantic.get(\'type\')!r} has no supported obsw-srdb representation",\n',
              '                (\n'
              '                    f"Core telemetry type {semantic.get(\'type\')!r} has no supported "\n'
              '                    "obsw-srdb representation"\n'
              '                ),\n',
          )
          replace_exact(
              projection,
              '                f"Core event severity {semantic.get(\'severity\')!r} cannot be projected through configured target map",\n',
              '                (\n'
              '                    f"Core event severity {semantic.get(\'severity\')!r} cannot be projected "\n'
              '                    "through configured target map"\n'
              '                ),\n',
          )

          replace_exact(
              target,
              '            f"{label} allocation {numeric_value} collides with baseline target {by_id[numeric_value]}",\n',
              '            (\n'
              '                f"{label} allocation {numeric_value} collides with baseline target "\n'
              '                f"{by_id[numeric_value]}"\n'
              '            ),\n',
          )
          replace_exact(
              target,
              '            f"Deterministic target name {target_name_value!r} collides with baseline {label} allocation {by_name[target_name_value]}",\n',
              '            (\n'
              '                f"Deterministic target name {target_name_value!r} collides with baseline "\n'
              '                f"{label} allocation {by_name[target_name_value]}"\n'
              '            ),\n',
          )
          replace_exact(
              target,
              '    for core_arg, target_arg in zip(core_arguments, target_parameters):\n',
              '    for core_arg, target_arg in zip(core_arguments, target_parameters, strict=False):\n',
          )
          replace_exact(
              verification,
              '        for argument_name in sorted(step.args):\n',
              '        for _argument_name in sorted(step.args):\n',
          )

          package = Path("src/orbitfabric_openobsw_opensvf_adapter")
          schema = package / "schemas/profile-0.1.schema.json"
          manifest_path = package / "integration_package.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          manifest["profile_schemas"][0]["sha256"] = hashlib.sha256(schema.read_bytes()).hexdigest()
          manifest_path.write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Validate Ruff baseline
        run: |
          python -m pip install "ruff==0.16.5"
          ruff format .
          ruff check .

      - name: Commit fixups
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Normalize extracted adapter lint and manifest digest"
          git push origin HEAD:${{ github.head_ref }}
