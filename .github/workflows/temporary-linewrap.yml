name: Temporary product wording linewrap

on:
  push:
    branches:
      - feat/openobsw-opensvf-bootstrap

permissions:
  contents: write

jobs:
  linewrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/openobsw-opensvf-bootstrap

      - name: Normalize product wording line lengths
        run: |
          python - <<'PY'
          from pathlib import Path

          preflight = Path("src/orbitfabric_openobsw_opensvf_adapter/adapter/preflight.py")
          text = preflight.read_text(encoding="utf-8")
          text = text.replace(
              'DEFAULT_SPACECRAFT_TEMPLATE = PACKAGE_ROOT / "resources" / "opensvf" / "verification_spacecraft.yaml"',
              'DEFAULT_SPACECRAFT_TEMPLATE = (\n    PACKAGE_ROOT / "resources" / "opensvf" / "verification_spacecraft.yaml"\n)',
          )
          preflight.write_text(text, encoding="utf-8")

          plan = Path("src/orbitfabric_openobsw_opensvf_adapter/adapter/verification_plan.py")
          text = plan.read_text(encoding="utf-8")
          text = text.replace(
              'raise _failure("the current verification_projection operation does not admit projected OrbitFabric expectation atoms")',
              'raise _failure(\n                "verification_projection does not admit projected OrbitFabric expectation atoms"\n            )',
          )
          plan.write_text(text, encoding="utf-8")

          projector = Path("src/orbitfabric_openobsw_opensvf_adapter/adapter/verification_projector.py")
          text = projector.read_text(encoding="utf-8")
          replacements = {
              '"the current verification_projection operation does not project Core scenario initial mode into "': '"verification_projection does not project Core initial mode into target runtime "',
              '"target runtime initialization."': '"initialization."',
              '"the current verification_projection operation does not project Core scenario initial telemetry into "': '"verification_projection does not project Core initial telemetry into target runtime "',
              '"the current verification_projection operation has no explicit Core telemetry injection to target injection mapping."': '"verification_projection has no explicit Core telemetry injection mapping."',
              '"expect_mode": ("the current verification_projection operation has no explicit Core mode to target observation mapping."),': '"expect_mode": (\n        "verification_projection has no explicit Core mode observation mapping."\n    ),',
              '"expect_event": ("the current verification_projection operation does not identify Core events from target PUS subtype alone."),': '"expect_event": (\n        "verification_projection cannot identify Core events from target PUS subtype alone."\n    ),',
              '"the current verification_projection operation does not map Core host-side command dispatch history "': '"verification_projection does not map Core host command history to target evidence."',
              '"to target runtime evidence."': '',
              '"the current verification_projection operation has no explicit Core telemetry to target observation mapping."': '"verification_projection has no explicit Core telemetry observation mapping."',
              '"the current verification_projection operation has no target payload lifecycle observation contract."': '"verification_projection has no target payload lifecycle observation contract."',
              '"the current verification_projection operation cannot project command arguments without an explicit "': '"verification_projection cannot project command arguments without an explicit "',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          projector.write_text(text, encoding="utf-8")
          PY

      - name: Commit linewrap if needed
        run: |
          if git diff --quiet; then
            echo "No linewrap changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Normalize product wording line lengths"
          git push origin HEAD:feat/openobsw-opensvf-bootstrap
