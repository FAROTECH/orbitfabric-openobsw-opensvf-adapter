name: Product Examples

on:
  pull_request:
    paths:
      - "examples/**"
      - "src/**"
      - "pyproject.toml"
      - "tools/build_release_bundle.py"
      - ".github/workflows/examples.yml"
  push:
    branches:
      - main
    paths:
      - "examples/**"
      - "src/**"
      - "pyproject.toml"
      - "tools/build_release_bundle.py"
      - ".github/workflows/examples.yml"

jobs:
  projection-examples:
    runs-on: ubuntu-latest
    env:
      ORBITFABRIC_STATE_DIR: ${{ github.workspace }}/.orbitfabric-state

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Core and release build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m pip install "git+https://github.com/FAROTECH/orbitfabric.git@4377d6656c62aa1dc19a7ed81d2de872b6b22ccd"

      - name: Build and install adapter through Adapter Manager
        run: |
          python -m build --wheel
          python tools/build_release_bundle.py \
            --wheel dist/orbitfabric_openobsw_opensvf_adapter-0.1.0-py3-none-any.whl \
            --authority github.com/FAROTECH \
            --publisher orbitfabric \
            --name openobsw-opensvf \
            --release-only
          orbitfabric adapter install \
            generated/release/adapter-release.json \
            --artifact dist/orbitfabric_openobsw_opensvf_adapter-0.1.0-py3-none-any.whl
          INSTANCE_ID="$(orbitfabric adapter list --json | python -c 'import json, sys; data = json.load(sys.stdin); assert len(data) == 1; print(data[0]["instance_id"])')"
          orbitfabric adapter verify "$INSTANCE_ID"
          echo "ORBITFABRIC_ADAPTER_INSTANCE_ID=$INSTANCE_ID" >> "$GITHUB_ENV"

      - name: Run mission contract projection example
        run: bash examples/01-mission-contract-projection/run.sh

      - name: Run scenario verification projection example
        run: bash examples/02-scenario-verification-projection/run.sh

  closed-loop-ping:
    needs: projection-examples
    runs-on: ubuntu-latest
    env:
      ORBITFABRIC_STATE_DIR: ${{ github.workspace }}/.orbitfabric-state

    steps:
      - name: Checkout adapter
        uses: actions/checkout@v4

      - name: Checkout validated OpenOBSW baseline
        uses: actions/checkout@v4
        with:
          repository: lipofefeyt/openobsw
          ref: 44ceb71a016f0541ff7a0aa74191e13bafdb59c1
          path: _openobsw

      - name: Checkout validated OpenSVF baseline
        uses: actions/checkout@v4
        with:
          repository: lipofefeyt/opensvf
          ref: 667d3eadcb0bbd7814ac324b99946c4ed2f11f23
          path: _opensvf

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Install Core and release build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m pip install "git+https://github.com/FAROTECH/orbitfabric.git@4377d6656c62aa1dc19a7ed81d2de872b6b22ccd"

      - name: Build and install adapter through Adapter Manager
        run: |
          python -m build --wheel
          python tools/build_release_bundle.py \
            --wheel dist/orbitfabric_openobsw_opensvf_adapter-0.1.0-py3-none-any.whl \
            --authority github.com/FAROTECH \
            --publisher orbitfabric \
            --name openobsw-opensvf \
            --release-only
          orbitfabric adapter install \
            generated/release/adapter-release.json \
            --artifact dist/orbitfabric_openobsw_opensvf_adapter-0.1.0-py3-none-any.whl
          INSTANCE_ID="$(orbitfabric adapter list --json | python -c 'import json, sys; data = json.load(sys.stdin); assert len(data) == 1; print(data[0]["instance_id"])')"
          orbitfabric adapter verify "$INSTANCE_ID"
          echo "ORBITFABRIC_ADAPTER_INSTANCE_ID=$INSTANCE_ID" >> "$GITHUB_ENV"

      - name: Install downstream-native packages
        run: |
          python -m pip install -e ./_openobsw/srdb
          python -m pip install -e ./_opensvf

      - name: Run closed-loop ping example
        env:
          OPENOBSW_ROOT: ${{ github.workspace }}/_openobsw
          OPENSVF_ROOT: ${{ github.workspace }}/_opensvf
        run: bash examples/03-closed-loop-ping/run.sh

      - name: Upload closed-loop native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-example-closed-loop-ping
          path: examples/.work/03-closed-loop-ping/native-evidence
          if-no-files-found: warn
