name: Temporary product cleanup

on:
  pull_request:

permissions:
  contents: write

jobs:
  cleanup:
    if: github.head_ref == 'feat/openobsw-opensvf-bootstrap'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Remove active PoC Stage language
        run: |
          python - <<'PY'
          from pathlib import Path

          roots = [Path("src"), Path("tests")]
          for root in roots:
              for path in root.rglob("*.py"):
                  text = path.read_text(encoding="utf-8")
                  updated = text
                  updated = updated.replace(
                      '"""Validate an OrbitFabric scenario and project the Stage 7.10 v0 subset."""',
                      '"""Validate an OrbitFabric scenario and project the supported verification subset."""',
                  )
                  updated = updated.replace(
                      '"""Project an already Core-validated LoadedScenario into a v0 plan."""',
                      '"""Project an already Core-validated LoadedScenario into a verification plan."""',
                  )
                  updated = updated.replace(
                      "Stage 7.10 v0",
                      "the current verification_projection operation",
                  )
                  updated = updated.replace(
                      "but the current verification_projection operation defines no target argument encoder.",
                      "but the adapter defines no target argument encoder for verification_projection.",
                  )
                  if updated != text:
                      path.write_text(updated, encoding="utf-8")

          preflight = Path(
              "src/orbitfabric_openobsw_opensvf_adapter/adapter/preflight.py"
          )
          text = preflight.read_text(encoding="utf-8")
          text = text.replace("stage7_10_spacecraft.yaml", "verification_spacecraft.yaml")
          preflight.write_text(text, encoding="utf-8")

          old = Path(
              "src/orbitfabric_openobsw_opensvf_adapter/resources/opensvf/stage7_10_spacecraft.yaml"
          )
          new = old.with_name("verification_spacecraft.yaml")
          text = old.read_text(encoding="utf-8").replace(
              "OrbitFabric-OpenOBSW-Stage7.10",
              "OrbitFabric-OpenOBSW-OpenSVF-Verification",
          )
          new.write_text(text, encoding="utf-8")
          old.unlink()
          PY

      - name: Commit cleanup if needed
        run: |
          if git diff --quiet; then
            echo "No product cleanup changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove residual PoC Stage language from product assets"
          git push origin HEAD:${{ github.head_ref }}
