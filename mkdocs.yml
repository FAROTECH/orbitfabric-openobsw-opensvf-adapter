site_name: OrbitFabric OpenOBSW/OpenSVF Adapter
site_description: Integration guide, compatibility evidence, coverage and release documentation for the OrbitFabric OpenOBSW/OpenSVF adapter.
site_url: https://farotech.github.io/orbitfabric-openobsw-opensvf-adapter/
repo_url: https://github.com/FAROTECH/orbitfabric-openobsw-opensvf-adapter
repo_name: FAROTECH/orbitfabric-openobsw-opensvf-adapter
edit_uri: ""

docs_dir: docs

theme:
  name: material
  language: en
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Examples:
      - Overview: examples/index.md
      - Mission Contract Projection: examples/mission-contract-projection.md
      - Scenario Verification Projection: examples/scenario-verification-projection.md
      - Closed-Loop Ping: examples/closed-loop-ping.md
  - Repository Anatomy: repository-anatomy.md
  - Adapter Identity: adapter-identity.md
  - Architecture and Ownership: architecture-and-ownership.md
  - Integration Contracts: integration-contracts.md
  - Projection Profile and Bindings: projection-profile-and-bindings.md
  - Testing and Conformance: testing-and-conformance.md
  - Evidence and Traceability: evidence-and-traceability.md
  - Runtime Dependencies: runtime-dependencies.md
  - Release Lifecycle: release-lifecycle.md
  - Integration Coverage: integration-coverage.md
  - Adapter Readiness Checklist: adapter-readiness-checklist.md
  - Migration from the PoC: migrating-from-poc.md
