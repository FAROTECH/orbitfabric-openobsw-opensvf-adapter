scenario:
  id: ping_verification
  name: Ping verification
  description: >
    Minimal lifecycle scenario proving that the OrbitFabric obc.ping action can
    be projected into the OpenOBSW/OpenSVF verification handoff while host-side
    expectations retain their explicit disposition.

mission:
  path: ../mission

initial_state:
  mode: NOMINAL
  telemetry: {}

steps:
  - t: 5
    command: obc.ping
    expect:
      command_status: ACCEPTED

  - t: 6
    expect_event: obc.ping_requested

  - t: 7
    expect:
      scenario_status: PASSED
